name: Refresh and deploy momentum dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      full_scan:
        description: Run the complete daily model scan before deployment
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "*/15 1-7 * * 1-5"
    - cron: "15 10 * * 1-5"
    - cron: "*/15 13-18 * * 1-5"
    - cron: "20 7 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore paper-trading ledger
        uses: actions/cache/restore@v4
        with:
          path: |
            state/paper_portfolio.json
            state/strategy_forward_watch.json
            state/signal_state.json
            state/cloud_latest.json
            state/raw
          key: paper-ledger-${{ github.run_id }}
          restore-keys: paper-ledger-
      - name: Restore latest cloud snapshot
        run: if [ -f state/cloud_latest.json ]; then cp state/cloud_latest.json dist/latest.json; fi
      - name: Determine refresh mode
        id: refresh_mode
        shell: bash
        run: |
          shanghai_hm="$(TZ=Asia/Shanghai date +%H%M)"
          # Every cron window in this workflow is a domestic futures trading
          # session.  Run the full multi-timeframe scan even when GitHub starts
          # the cron late; breadth-only runs left the displayed 5-minute price
          # frozen at the prior close.
          full_scan=true
          echo "full_scan=$full_scan" >> "$GITHUB_OUTPUT"
          echo "Shanghai time $shanghai_hm; full_scan=$full_scan"
      - name: Refresh real market snapshot
        if: steps.refresh_mode.outputs.full_scan == 'true'
        continue-on-error: true
        run: python momentum_monitor.py --scan
      - name: Preserve latest cloud snapshot
        run: mkdir -p state && cp dist/latest.json state/cloud_latest.json
      - name: Save paper-trading ledger
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            state/paper_portfolio.json
            state/strategy_forward_watch.json
            state/signal_state.json
            state/cloud_latest.json
            state/raw
          key: paper-ledger-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
